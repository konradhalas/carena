name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GDTOOLKIT_VERSION: 4.5.0
  CODE_DIRS: scripts tests tools

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - run: gdlint $CODE_DIRS
      - run: gdformat --check --diff $CODE_DIRS

  project-check:
    name: Project loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLO "$base/$zip"
          curl -fsSL "$base/SHA512-SUMS.txt" | grep " $zip\$" | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --import
      - name: Check scripts and scenes
        run: godot --headless --script res://tools/check_project.gd

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLO "$base/$zip"
          curl -fsSL "$base/SHA512-SUMS.txt" | grep " $zip\$" | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --import
      # Headless on purpose: the tests don't need rendering, and software
      # rendering on CI runners made the full renderer far too slow (timeouts).
      - name: Run tests
        timeout-minutes: 10
        run: GODOT_BIN=/usr/local/bin/godot ./addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -a res://tests
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore
